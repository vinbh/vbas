version: 2

project_name: peek

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - main: ./cmd/peek
    binary: peek
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - format: tar.gz
    name_template: "peek_{{ .Os }}_{{ .Arch }}"
    wrap_in_directory: true
    files:
      - specs/**
      - shell/zsh/peek.zsh
      - shell/bash/peek.bash
      - install.sh
      - uninstall.sh

checksum:
  name_template: "checksums.txt"

nfpms:
  - package_name: peek
    vendor: Vinayak Bhatt
    homepage: https://github.com/vinbh/peek
    maintainer: Vinayak Bhatt <vinayak.farcry@gmail.com>
    description: |-
      >_ peek: Amazon Q-style dropdown autocomplete for Linux terminals.
      Works in zsh and bash with Tab and Space triggers.
    license: PolyForm-Noncommercial-1.0.0
    formats:
      - deb
      - rpm
      - apk
      - archlinux
    contents:
      - src: specs/
        dst: /usr/share/peek/specs/
        type: tree
      - src: shell/zsh/peek.zsh
        dst: /usr/share/peek/shell/zsh/peek.zsh
      - src: shell/bash/peek.bash
        dst: /usr/share/peek/shell/bash/peek.bash
    scripts:
      postinstall: scripts/pkg-postinstall.sh

brews:
  - name: peek
    repository:
      owner: vinbh
      name: homebrew-peek
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/vinbh/peek"
    description: ">_ peek: Amazon Q-style dropdown autocomplete for Linux and macOS. Works in zsh and bash."
    license: "PolyForm-Noncommercial-1.0.0"
    skip_upload: auto
    install: |
      bin.install "peek"
      pkgshare.install "specs"
      pkgshare.install "shell"
    caveats: |
      To enable peek, add one line to your shell rc file:

        zsh  - add to ~/.zshrc:
          source #{opt_pkgshare}/shell/zsh/peek.zsh

        bash - add to ~/.bashrc:
          source #{opt_pkgshare}/shell/bash/peek.bash

      Then open a new terminal (or run: source ~/.zshrc).
      No further setup needed - specs are installed automatically.
    test: |
      system "#{bin}/peek", "version"

release:
  github:
    owner: vinbh
    name: peek
  draft: false
  prerelease: auto

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"
