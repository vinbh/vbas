version: 2

project_name: vbas

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - main: ./cmd/vbas
    binary: vbas
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - format: tar.gz
    name_template: "vbas_{{ .Os }}_{{ .Arch }}"
    wrap_in_directory: true
    files:
      - specs/**
      - shell/zsh/vbas.zsh
      - shell/bash/vbas.bash
      - install.sh
      - uninstall.sh

checksum:
  name_template: "checksums.txt"

brews:
  - name: vbas
    repository:
      owner: vinbh
      name: homebrew-vbas
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/vinbh/vbas"
    description: "Amazon Q-style dropdown autocomplete for Linux and macOS. Works in zsh and bash."
    license: "PolyForm-Noncommercial-1.0.0"
    skip_upload: auto
    install: |
      bin.install "vbas"
      pkgshare.install "specs"
      pkgshare.install "shell"
    caveats: |
      To enable vbas, add one line to your shell rc file:

        zsh  — add to ~/.zshrc:
          source #{opt_pkgshare}/shell/zsh/vbas.zsh

        bash — add to ~/.bashrc:
          source #{opt_pkgshare}/shell/bash/vbas.bash

      Then open a new terminal (or run: source ~/.zshrc).
      No further setup needed — specs are installed automatically.
    test: |
      system "#{bin}/vbas", "version"

release:
  github:
    owner: vinbh
    name: vbas
  draft: false
  prerelease: auto

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"
